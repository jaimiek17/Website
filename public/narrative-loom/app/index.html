<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06152d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Narrative Loom"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>The Narrative Loom</title><style>
*{box-sizing:border-box}body{margin:0;background:#06152d;color:#f7efd9;font-family:Georgia,serif}.app{max-width:560px;margin:auto;padding:30px 18px}.hero{text-align:center}.gold{color:#e4bd68}.panel{background:#0b2344;border:1px solid #e4bd6840;border-radius:22px;padding:18px;margin-top:18px}.section{display:none}.active{display:block}button{width:100%;padding:16px;margin:6px 0;border-radius:16px;border:1px solid #e4bd6860;background:#102d52;color:#f7efd9;font:inherit}.primary{background:linear-gradient(135deg,#b8882f,#e7c66f,#9e7025);color:#071326;font-weight:bold}.card{width:min(86vw,340px);aspect-ratio:5/7;margin:20px auto;border-radius:18px;overflow:hidden}.card img{width:100%;height:100%;object-fit:cover}textarea{width:100%;height:180px;background:#041127;color:white;border:1px solid #e4bd6860;border-radius:14px;padding:12px}.small{text-align:center;color:#bbb;line-height:1.5}</style></head><body><div class="app"><div class="hero"><div class="gold">JAIMIE KOZYRA</div><h1>Navigating Your Inner Landscape</h1><p>The Narrative Loom · 44-card personal oracle deck</p></div>
<div id="home" class="section active"><div class="panel"><h2>Choose your journey</h2><button class="primary" onclick="draw()">✦ DRAW A CARD</button><button onclick="daily()">☾ DAILY CARD</button><button onclick="journal()">✎ MY JOURNAL</button><button onclick="history()">⌘ PAST PULLS</button><p class="small">Your journal and pull history stay on this device.</p></div></div>
<div id="draw" class="section"><button onclick="home()">← Back</button><div class="panel"><p id="hint" class="small">Your card is waiting.</p><div id="card" class="card"></div><button id="reveal" class="primary" onclick="reveal()">REVEAL</button><button onclick="draw()">DRAW ANOTHER</button><div id="reflection"></div></div></div>
<div id="daily" class="section"><button onclick="home()">← Back</button><div class="panel"><h2>Today's Card</h2><div id="dailybox"></div></div></div>
<div id="journal" class="section"><button onclick="home()">← Back</button><div class="panel"><h2>My Journal</h2><div id="journalbox"></div></div></div>
<div id="history" class="section"><button onclick="home()">← Back</button><div class="panel"><h2>Past Pulls</h2><div id="historybox"></div></div></div></div>
<script>const cards=[{"id": 1, "title": "The Subconscious Cave", "image": "cards/01_The_Subconscious_Cave.png"}, {"id": 2, "title": "The Patterned Path", "image": "cards/02_The_Patterned_Path.png"}, {"id": 3, "title": "The Narrative Loom", "image": "cards/03_The_Narrative_Loom.png"}, {"id": 4, "title": "The Boundary Stones", "image": "cards/04_The_Boundary_Stones.png"}, {"id": 5, "title": "The Compass of Truth", "image": "cards/05_The_Compass_of_Truth.png"}, {"id": 6, "title": "The Transformative Flame", "image": "cards/06_The_Transformative_Flame.png"}, {"id": 7, "title": "The Sovereign Throne", "image": "cards/07_The_Sovereign_Throne.png"}, {"id": 8, "title": "The Authentic Mirror", "image": "cards/08_The_Authentic_Mirror.png"}, {"id": 9, "title": "The Seed of Intention", "image": "cards/09_The_Seed_of_Intention.png"}, {"id": 10, "title": "The Guardian", "image": "cards/10_The_Guardian.png"}, {"id": 11, "title": "The Wild Root", "image": "cards/11_The_Wild_Root.png"}, {"id": 12, "title": "The Flowing River", "image": "cards/12_The_Flowing_River.png"}, {"id": 13, "title": "The Silent Mountain", "image": "cards/13_The_Silent_Mountain.png"}, {"id": 14, "title": "The Moonlight Grove", "image": "cards/14_The_Moonlight_Grove.png"}, {"id": 15, "title": "The Weave of Destiny", "image": "cards/15_The_Weave_of_Destiny.png"}, {"id": 16, "title": "The Alchemists Vessel", "image": "cards/16_The_Alchemists_Vessel.png"}, {"id": 17, "title": "The Healers Hands", "image": "cards/17_The_Healers_Hands.png"}, {"id": 18, "title": "The Cosmic Hourglass", "image": "cards/18_The_Cosmic_Hourglass.png"}, {"id": 19, "title": "The Labyrinth Path", "image": "cards/19_The_Labyrinth_Path.png"}, {"id": 20, "title": "The Golden Key", "image": "cards/20_The_Golden_Key.png"}, {"id": 21, "title": "The Sacred Mask", "image": "cards/21_The_Sacred_Mask.png"}, {"id": 22, "title": "The Anchor Stone", "image": "cards/22_The_Anchor_Stone.png"}, {"id": 23, "title": "The Infinite Loop", "image": "cards/23_The_Infinite_Loop.png"}, {"id": 24, "title": "The Rising Sun", "image": "cards/24_The_Rising_Sun.png"}, {"id": 25, "title": "The Starry Sky", "image": "cards/25_The_Starry_Sky.png"}, {"id": 26, "title": "The Ocean Depths", "image": "cards/26_The_Ocean_Depths.png"}, {"id": 27, "title": "The Desert Rose", "image": "cards/27_The_Desert_Rose.png"}, {"id": 28, "title": "The Lightning Strike", "image": "cards/28_The_Lightning_Strike.png"}, {"id": 29, "title": "The Silent Library", "image": "cards/29_The_Silent_Library.png"}, {"id": 30, "title": "The Broken Vessel", "image": "cards/30_The_Broken_Vessel.png"}, {"id": 31, "title": "The Open Door", "image": "cards/31_The_Open_Door.png"}, {"id": 32, "title": "The Crystal Cluster", "image": "cards/32_The_Crystal_Cluster.png"}, {"id": 33, "title": "The Ancient Tree", "image": "cards/33_The_Ancient_Tree.png"}, {"id": 34, "title": "The Shadow Weaver", "image": "cards/34_The_Shadow_Weaver.png"}, {"id": 35, "title": "The Well of Wisdom", "image": "cards/35_The_Well_of_Wisdom.png"}, {"id": 36, "title": "The Mirror Shard", "image": "cards/36_The_Mirror_Shard.png"}, {"id": 37, "title": "The Knot Untied", "image": "cards/37_The_Knot_Untied.png"}, {"id": 38, "title": "The Crown of Thorns", "image": "cards/38_The_Crown_of_Thorns.png"}, {"id": 39, "title": "The Shield of Grace", "image": "cards/39_The_Shield_of_Grace.png"}, {"id": 40, "title": "The Hourglass of Now", "image": "cards/40_The_Hourglass_of_Now.png"}, {"id": 41, "title": "The River Stones", "image": "cards/41_The_River_Stones.png"}, {"id": 42, "title": "The Phoenix Feather", "image": "cards/42_The_Phoenix_Feather.png"}, {"id": 43, "title": "The Labyrinth Gate", "image": "cards/43_The_Labyrinth_Gate.png"}, {"id": 44, "title": "The Cosmic Weaver", "image": "cards/44_The_Cosmic_Weaver.png"}];let current=null;function show(x){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(x).classList.add('active');scrollTo(0,0)}function home(){show('home')}function draw(){current=cards[Math.floor(Math.random()*cards.length)];document.getElementById('card').innerHTML='<div style="height:100%;display:flex;align-items:center;justify-content:center;background:#0b2344;color:#e4bd68;font-size:18px">THE NARRATIVE LOOM</div>';document.getElementById('reveal').style.display='block';document.getElementById('reflection').innerHTML='';show('draw')}function reveal(){document.getElementById('card').innerHTML='<img src="'+current.image+'" alt="'+current.title+'">';document.getElementById('hint').textContent=current.title;document.getElementById('reveal').style.display='none';document.getElementById('reflection').innerHTML='<p class="small">Take a moment to reflect on this card.</p><textarea id="note" placeholder="Write your reflection…"></textarea><button class="primary" onclick="save()">SAVE REFLECTION</button>';let h=JSON.parse(localStorage.getItem('loom')||'[]');h.unshift({title:current.title,image:current.image,date:new Date().toISOString(),note:''});localStorage.setItem('loom',JSON.stringify(h.slice(0,100)))}function save(){let h=JSON.parse(localStorage.getItem('loom')||'[]');h[0].note=document.getElementById('note').value;localStorage.setItem('loom',JSON.stringify(h));document.getElementById('reflection').innerHTML='<p class="small">Saved ✦</p>'}function daily(){let k='daily'+new Date().toDateString(),d=JSON.parse(localStorage.getItem(k)||'null');if(!d){d=cards[Math.floor(Math.random()*cards.length)];localStorage.setItem(k,JSON.stringify(d))}document.getElementById('dailybox').innerHTML='<div class="card"><img src="'+d.image+'"></div><p class="small">'+d.title+'</p>';show('daily')}function journal(){let h=JSON.parse(localStorage.getItem('loom')||'[]').filter(x=>x.note);document.getElementById('journalbox').innerHTML=h.length?h.map(x=>'<p><b>'+x.title+'</b><br>'+x.note+'</p>').join(''):'<p class="small">No saved reflections yet.</p>';show('journal')}function history(){let h=JSON.parse(localStorage.getItem('loom')||'[]');document.getElementById('historybox').innerHTML=h.length?h.map(x=>'<p><b>'+x.title+'</b><br><small>'+new Date(x.date).toLocaleString()+'</small></p>').join(''):'<p class="small">No pulls yet.</p>';show('history')}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
